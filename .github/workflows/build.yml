name: Build Dokaibe AI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: dokaibe-ai-jar
          path: target/DokaibeAI-1.0.0.jar
